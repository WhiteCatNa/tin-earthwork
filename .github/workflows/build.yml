name: 打包 Windows 可执行程序

on:
  push:
    branches: [main]
  workflow_dispatch:   # 支持手动触发

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: 打包（PyInstaller）
        run: |
          pyinstaller --noconfirm --clean `
            --name "TIN土方自动算量系统" `
            --noconsole `
            --hidden-import matplotlib.backends.backend_tkagg `
            --hidden-import matplotlib.backends._backend_tk `
            --hidden-import PIL._tkinter_finder `
            --hidden-import scipy.spatial._qhull `
            --hidden-import openpyxl.cell._writer `
            --collect-data matplotlib `
            --collect-data tkcalendar `
            --collect-submodules matplotlib.backends `
            --collect-submodules tkcalendar `
            main.py

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: TIN土方自动算量系统-Windows
          path: dist/TIN土方自动算量系统/
          retention-days: 30
