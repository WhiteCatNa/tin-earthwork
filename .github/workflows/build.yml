name: 测试并打包 Windows 可执行程序

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:   # 支持手动触发

jobs:
  test-and-build-windows:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"   # Windows 控制台默认 cp1252，中文输出会报 UnicodeEncodeError
    steps:
      - name: 检出代码
        uses: actions/checkout@v5

      - name: 配置 Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 单元测试
        run: python -m pytest -q

      - name: 端到端全流程验证
        run: python run_full_test.py --output-dir ./验证输出

      - name: 打包（PyInstaller，与本地共用 tin_earthwork.spec）
        run: pyinstaller --noconfirm --clean tin_earthwork.spec

      - name: 上传产物
        uses: actions/upload-artifact@v5
        with:
          name: TIN土方自动算量系统-Windows
          path: dist/TIN土方自动算量系统/
          retention-days: 30
