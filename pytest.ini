[pytest]
pythonpath = .
testpaths = tests
# 界面压力测试是独立脚本，用 python tests/gui_stress_test.py 运行
# --capture=sys：默认的 fd 级输出捕获会在测试阶段之间 dup2() 进程的 stdout/stderr，
# 关掉 Tcl 缓存的 Windows 句柄，之后新建 Tk() 偶尔在 Tcl 初始化中途失败
# （TclError: invalid command name "tcl_findLibrary"）。界面测试每个都新建窗口，改为 Python 级捕获。
addopts = --ignore=tests/gui_stress_test.py --capture=sys
